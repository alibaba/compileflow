<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">CompileFlow designer</title>
  <desc id="description">A process designer with a node palette, connected workflow, and properties panel.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17172b"/>
      <stop offset="1" stop-color="#242044"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fafaff"/>
      <stop offset="1" stop-color="#f0efff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#100d2d" flood-opacity=".42"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#cbc7e8"/>
    </pattern>
  </defs>
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="1160" height="720" rx="24" fill="url(#shell)"/>
    <rect x="20" y="20" width="1160" height="72" rx="24" fill="#121224"/>
    <circle cx="58" cy="56" r="8" fill="#ff6b7d"/><circle cx="84" cy="56" r="8" fill="#f7c85b"/><circle cx="110" cy="56" r="8" fill="#62d69b"/>
    <rect x="150" y="43" width="190" height="26" rx="8" fill="#2f2c4d"/>
    <rect x="964" y="40" width="174" height="32" rx="9" fill="#6c58ff"/>
    <rect x="20" y="92" width="238" height="648" fill="#1b1a31"/>
    <text x="52" y="138" fill="#a8a3c8" font-family="system-ui,sans-serif" font-size="16" font-weight="600">NODE PALETTE</text>
    <g fill="#2a2844" stroke="#413d69">
      <rect x="44" y="166" width="190" height="66" rx="12"/><rect x="44" y="246" width="190" height="66" rx="12"/>
      <rect x="44" y="326" width="190" height="66" rx="12"/><rect x="44" y="406" width="190" height="66" rx="12"/>
    </g>
    <g fill="#d9d6ef" font-family="system-ui,sans-serif" font-size="15">
      <text x="72" y="205">Start event</text><text x="72" y="285">Script task</text>
      <text x="72" y="365">Gateway</text><text x="72" y="445">End event</text>
    </g>
    <rect x="258" y="92" width="676" height="648" fill="url(#canvas)"/>
    <rect x="258" y="92" width="676" height="648" fill="url(#grid)"/>
    <path d="M368 402H452M650 402H740" stroke="#79728f" stroke-width="5" fill="none"/>
    <path d="m448 392 18 10-18 10m288-20 18 10-18 10" fill="#79728f"/>
    <circle cx="336" cy="402" r="32" fill="#e8fff3" stroke="#37b77a" stroke-width="6"/>
    <path d="m328 384 22 18-22 18z" fill="#37b77a"/>
    <rect x="466" y="354" width="184" height="96" rx="14" fill="#fff" stroke="#725cff" stroke-width="5"/>
    <rect x="486" y="376" width="28" height="28" rx="6" fill="#725cff"/>
    <text x="528" y="398" fill="#24203c" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Build result</text>
    <text x="486" y="428" fill="#817b98" font-family="system-ui,sans-serif" font-size="14">QLExpress</text>
    <circle cx="786" cy="402" r="32" fill="#fff0f1" stroke="#ec5368" stroke-width="6"/>
    <rect x="775" y="391" width="22" height="22" rx="3" fill="#ec5368"/>
    <rect x="934" y="92" width="246" height="648" fill="#1e1c36"/>
    <text x="966" y="140" fill="#f1efff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Properties</text>
    <text x="966" y="190" fill="#9892bc" font-family="system-ui,sans-serif" font-size="14">NODE NAME</text>
    <rect x="966" y="206" width="180" height="42" rx="9" fill="#2d2a4b" stroke="#4b4674"/>
    <text x="982" y="233" fill="#dedaf5" font-family="system-ui,sans-serif" font-size="14">Build result</text>
    <text x="966" y="294" fill="#9892bc" font-family="system-ui,sans-serif" font-size="14">SCRIPT LANGUAGE</text>
    <rect x="966" y="310" width="180" height="42" rx="9" fill="#2d2a4b" stroke="#4b4674"/>
    <text x="982" y="337" fill="#dedaf5" font-family="system-ui,sans-serif" font-size="14">QLExpress</text>
  </g>
</svg>
