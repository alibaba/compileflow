packages:
  - 'apps/*'

engineStrict: true
nodeVersion: 24.20.0
autoInstallPeers: false
strictPeerDependencies: true
overrides:
  browserslist: 4.28.7
  dompurify: 3.4.13
  nanoid: 3.3.18
  picomatch: 4.0.7
  postcss: 8.5.23
  qs: 6.16.0
  ws: 8.21.0
peerDependencyRules:
  ignoreMissing:
    # Optional adapters and runtimes that Workbench does not use.
    - '@edge-runtime/vm'
    - '@opentelemetry/api'
    - '@vitest/browser'
    - '@vitest/browser-*'
    - '@vitest/coverage-istanbul'
    - '@vitest/ui'
    - 'bare-*'
    - bufferutil
    - canvas
    - date-fns
    - happy-dom
    - jiti
    - less
    - lightningcss
    - luxon
    - moment
    - msw
    - react-native-b4a
    - sass
    - sass-embedded
    - stylus
    - sugarss
    - utf-8-validate
    - yaml
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
allowBuilds:
  esbuild: true
