name: Supply Chain

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
    paths:
      - 'pom.xml'
      - 'compileflow-*/pom.xml'
      - 'compileflow-durable/**'
      - 'compileflow-deploy/pom.xml'
      - 'compileflow-deploy/*/pom.xml'
      - 'scripts/verify_maven_sbom.py'
      - 'scripts/tests/test_verify_maven_sbom.py'
      - '.github/workflows/java-security.yml'
      - '.github/workflows/supply-chain.yml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
  pull_request:
    branches: [ master ]
    paths:
      - 'pom.xml'
      - 'compileflow-*/pom.xml'
      - 'compileflow-durable/**'
      - 'compileflow-deploy/pom.xml'
      - 'compileflow-deploy/*/pom.xml'
      - 'scripts/verify_maven_sbom.py'
      - 'scripts/tests/test_verify_maven_sbom.py'
      - '.github/workflows/java-security.yml'
      - '.github/workflows/supply-chain.yml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  java-dependency-scan:
    name: Scan Java runtime dependencies
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/java-security.yml
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  maven-sbom:
    name: Maven aggregate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate Maven aggregate SBOM
        run: |
          # Resolve this checkout's artifacts, not stale dependencies from the Maven cache.
          ./mvnw install -DskipTests \
            -B -V --no-transfer-progress
          ./mvnw org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
            -Dcyclonedx.skipAttach=true \
            -B -V --no-transfer-progress

      - name: Verify Maven aggregate SBOM
        run: |
          python3 -m unittest scripts.tests.test_verify_maven_sbom
          python3 scripts/verify_maven_sbom.py target/compileflow-bom.json

      - name: Generate SBOM checksum subject
        run: |
          cd target
          sha256sum compileflow-bom.json > compileflow-bom.sha256

      - name: Attest Maven SBOM build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: target/compileflow-bom.sha256

      - name: Upload Maven SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compileflow-maven-sbom
          path: |
            target/compileflow-bom.json
            target/compileflow-bom.sha256
          retention-days: 14
