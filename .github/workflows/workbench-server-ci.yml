name: CompileFlow Workbench Server CI

on:
  workflow_call:
  push:
    branches: [ master ]
    paths:
      - 'compileflow-workbench-server/**'
      - 'compileflow-deploy/**'
      - 'compileflow-integration-tests/**'
      - 'compileflow-spring-boot-autoconfigure/**'
      - 'compileflow-api/**'
      - 'compileflow-core/**'
      - 'compileflow-tbbpm/**'
      - 'compileflow-bpmn/**'
      - 'examples/spring-boot-deployment/**'
      - 'docs/specs/openapi/**'
      - '.github/workflows/workbench-server-ci.yml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'checkstyle.xml'
      - 'checkstyle-javadoc.xml'
      - 'scripts/check_architecture_boundaries.py'
      - 'scripts/junit_evidence.py'
      - 'scripts/run_server_targeted_tests.sh'
      - 'scripts/tests/test_verify_workbench_postgres_evidence.py'
      - 'scripts/verify_workbench_postgres_evidence.py'
      - 'scripts/verify_database_contract_evidence.py'
      - 'scripts/tests/test_verify_database_contract_evidence.py'
      - 'scripts/verify_spotbugs_reports.py'
      - 'scripts/smoke_test_workbench_server_executable_jar.py'
      - 'scripts/fixtures/executable-jar-flow.tbbpm.xml'
      - 'release-baselines.json'
      - 'pom.xml'
  pull_request:
    branches: [ master ]
    paths:
      - 'compileflow-workbench-server/**'
      - 'compileflow-deploy/**'
      - 'compileflow-integration-tests/**'
      - 'compileflow-spring-boot-autoconfigure/**'
      - 'compileflow-api/**'
      - 'compileflow-core/**'
      - 'compileflow-tbbpm/**'
      - 'compileflow-bpmn/**'
      - 'examples/spring-boot-deployment/**'
      - 'docs/specs/openapi/**'
      - '.github/workflows/workbench-server-ci.yml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'checkstyle.xml'
      - 'checkstyle-javadoc.xml'
      - 'scripts/check_architecture_boundaries.py'
      - 'scripts/junit_evidence.py'
      - 'scripts/run_server_targeted_tests.sh'
      - 'scripts/tests/test_verify_workbench_postgres_evidence.py'
      - 'scripts/verify_workbench_postgres_evidence.py'
      - 'scripts/verify_database_contract_evidence.py'
      - 'scripts/tests/test_verify_database_contract_evidence.py'
      - 'scripts/verify_spotbugs_reports.py'
      - 'scripts/smoke_test_workbench_server_executable_jar.py'
      - 'scripts/fixtures/executable-jar-flow.tbbpm.xml'
      - 'release-baselines.json'
      - 'pom.xml'

permissions:
  contents: read

jobs:
  test:
    name: Server quality gates and unit tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: compileflow_test
          POSTGRES_USER: compileflow
          POSTGRES_PASSWORD: compileflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compileflow -d compileflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run architecture boundary checks
        run: python3 scripts/check_architecture_boundaries.py

      - name: Test PostgreSQL evidence verifier
        run: |
          python3 -m unittest scripts.tests.test_verify_workbench_postgres_evidence
          python3 -m unittest scripts.tests.test_verify_database_contract_evidence

      - name: Build compileflow-workbench-server dependencies
        run: |
          ./mvnw install -pl compileflow-workbench-server -am -DskipTests \
            -B -V --no-transfer-progress

      - name: Run Spotless format check
        run: |
          ./mvnw -Pexamples,benchmarks -pl '!compileflow-bom' \
            com.diffplug.spotless:spotless-maven-plugin:3.9.0:check \
            -B -V --no-transfer-progress

      - name: Run compileflow-workbench-server checkstyle
        run: |
          ./mvnw checkstyle:check -pl compileflow-workbench-server -am \
            -B -V --no-transfer-progress

      - name: Run public API Javadoc style
        run: |
          ./mvnw checkstyle:check \
            -pl compileflow-api,compileflow-deploy/compileflow-deploy-api,compileflow-deploy/compileflow-deploy-protocol \
            -Dcheckstyle.config.location=checkstyle-javadoc.xml \
            -B -V --no-transfer-progress

      - name: Run compileflow-workbench-server SpotBugs
        run: |
          ./mvnw spotbugs:check -pl compileflow-workbench-server -am \
            -B -V --no-transfer-progress
          python3 scripts/verify_spotbugs_reports.py \
            compileflow-api \
            compileflow-core \
            compileflow-tbbpm \
            compileflow-bpmn \
            compileflow-deploy/compileflow-deploy-api \
            compileflow-deploy/compileflow-deploy-protocol \
            compileflow-deploy/compileflow-deploy-control-plane \
            compileflow-deploy/compileflow-deploy-runtime \
            compileflow-deploy/compileflow-deploy-spring-boot-autoconfigure \
            compileflow-spring-boot-autoconfigure \
            compileflow-workbench-server

      - name: Generate public API Javadocs
        run: |
          ./mvnw javadoc:javadoc \
            -pl compileflow-api,compileflow-deploy/compileflow-deploy-api,compileflow-deploy/compileflow-deploy-protocol \
            -B -V --no-transfer-progress

      - name: Run deployment unit and H2 repository tests
        run: |
          ./mvnw test \
            -pl compileflow-deploy/compileflow-deploy-api,compileflow-deploy/compileflow-deploy-protocol,compileflow-deploy/compileflow-deploy-control-plane,compileflow-deploy/compileflow-deploy-runtime,compileflow-deploy/compileflow-deploy-spring-boot-autoconfigure,compileflow-deploy/compileflow-deploy-spring-boot-autoconfigure-postgresql,compileflow-deploy/compileflow-deploy-spring-boot-autoconfigure-mysql \
            -am \
            -B -V --no-transfer-progress

      - name: Run targeted compileflow-workbench-server tests
        run: scripts/run_server_targeted_tests.sh

      - name: Smoke-test the executable JAR
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/compileflow_test
          SPRING_DATASOURCE_USERNAME: compileflow
          SPRING_DATASOURCE_PASSWORD: compileflow_test_password
        run: python3 scripts/smoke_test_workbench_server_executable_jar.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compileflow-workbench-server-surefire
          path: compileflow-workbench-server/target/surefire-reports/
          retention-days: 7

  postgres-contract:
    name: Workbench and Deploy PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '16.15'
            postgres_image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          - postgres: '17.11'
            postgres_image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          - postgres: '18.6'
            postgres_image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_DB: compileflow_test
          POSTGRES_USER: compileflow
          POSTGRES_PASSWORD: compileflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compileflow -d compileflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Validate Workbench, Deploy, and embedded execution contracts
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/compileflow_test
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: compileflow
          SPRING_DATASOURCE_PASSWORD: compileflow_test_password
          COMPILEFLOW_WORKBENCH_SERVER_CONFIG_DATABASE_PROVIDER: POSTGRESQL
          COMPILEFLOW_WORKBENCH_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/compileflow_test
          COMPILEFLOW_WORKBENCH_TEST_POSTGRES_USERNAME: compileflow
          COMPILEFLOW_WORKBENCH_TEST_POSTGRES_PASSWORD: compileflow_test_password
        run: |
          ./mvnw test \
            -pl compileflow-workbench-server \
            -am \
            -Dtest=ProcessDraftServicePersistenceTest,ProcessOptimisticLockPersistenceTest,ExecutionLogAggregationPersistenceTest,AsyncInvocationStoreContractTest,WorkbenchExternalSchemaAdmissionTest,PostgreSqlDeployRepositoryContractTest,EmbeddedDeploymentExecutionIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -B -V --no-transfer-progress

      - name: Reject missing, failed, or skipped PostgreSQL evidence
        run: python3 scripts/verify_workbench_postgres_evidence.py .

      - name: Execute the production release lifecycle example
        if: matrix.postgres == '18.6'
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/compileflow_test
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: compileflow
          SPRING_DATASOURCE_PASSWORD: compileflow_test_password
        run: |
          ./mvnw test \
            -pl examples/spring-boot-deployment \
            -Pexamples -am \
            -Dtest=DeploymentExampleApplicationTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -B -V --no-transfer-progress
          python3 scripts/verify_database_contract_evidence.py \
            --database PostgreSQL \
            --require DeploymentExampleApplicationTest

      - name: Verify tested source identity
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Record PostgreSQL environment identity
        if: always()
        run: |
          mkdir -p compileflow-workbench-server/target/release-evidence
          {
            echo "commit=${GITHUB_SHA}"
            echo "declared_postgres=${{ matrix.postgres }}"
            echo "declared_image=${{ matrix.postgres_image }}"
            docker image inspect \
              --format='resolved_image={{index .RepoDigests 0}}' \
              '${{ matrix.postgres_image }}'
            java -version 2>&1
          } > compileflow-workbench-server/target/release-evidence/postgres-environment.txt

      - name: Upload PostgreSQL contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compileflow-workbench-postgres-${{ matrix.postgres }}
          path: |
            compileflow-deploy/compileflow-deploy-postgresql/target/surefire-reports/TEST-*PostgreSqlDeployRepositoryContractTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*EmbeddedDeploymentExecutionIntegrationTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*PersistenceTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*AsyncInvocationStoreContractTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*ExternalSchemaAdmissionTest.xml
            examples/spring-boot-deployment/target/surefire-reports/TEST-*DeploymentExampleApplicationTest.xml
            compileflow-workbench-server/target/release-evidence/postgres-environment.txt
          retention-days: 30

  mysql-contract:
    name: Workbench and Deploy MySQL 8.4.7
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.7@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
        env:
          MYSQL_DATABASE: compileflow_test
          MYSQL_USER: compileflow
          MYSQL_PASSWORD: compileflow_test_password
          MYSQL_ROOT_PASSWORD: compileflow_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pcompileflow_root_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Initialize MySQL schemas with the DDL administrator
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/compileflow_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: compileflow_root_password
          COMPILEFLOW_WORKBENCH_SERVER_CONFIG_DATABASE_PROVIDER: MYSQL
        run: |
          ./mvnw test -pl compileflow-workbench-server -am \
            -Dtest=WorkbenchExternalSchemaAdmissionTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -B -V --no-transfer-progress

      - name: Restrict the application account to DML
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -pcompileflow_root_password -e "
            REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'compileflow'@'%';
            GRANT SELECT, INSERT, UPDATE, DELETE ON compileflow_test.* TO 'compileflow'@'%';
          "

      - name: Validate MySQL Deploy and Workbench semantic Store contracts
        env:
          COMPILEFLOW_MYSQL_JDBC_URL: jdbc:mysql://localhost:3306?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          COMPILEFLOW_MYSQL_JDBC_USERNAME: root
          COMPILEFLOW_MYSQL_JDBC_PASSWORD: compileflow_root_password
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/compileflow_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
          SPRING_DATASOURCE_USERNAME: compileflow
          SPRING_DATASOURCE_PASSWORD: compileflow_test_password
          COMPILEFLOW_WORKBENCH_SERVER_CONFIG_DATABASE_PROVIDER: MYSQL
          COMPILEFLOW_WORKBENCH_SERVER_CONFIG_DATABASE_MIGRATE: 'false'
        run: |
          ./mvnw test \
            -pl compileflow-deploy/compileflow-deploy-mysql,compileflow-workbench-server \
            -am \
            -Dtest=MySqlDeployRepositoryContractTest,AsyncInvocationStoreContractTest,WorkbenchExternalSchemaAdmissionTest,ProcessDraftServicePersistenceTest,ExecutionLogAggregationPersistenceTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -B -V --no-transfer-progress

      - name: Reject skipped or failed MySQL contracts
        run: |
          python3 scripts/verify_database_contract_evidence.py \
            --database MySQL \
            --require MySqlDeployRepositoryContractTest \
            --require AsyncInvocationStoreContractTest \
            --require WorkbenchExternalSchemaAdmissionTest \
            --require ProcessDraftServicePersistenceTest \
            --require ExecutionLogAggregationPersistenceTest

      - name: Upload MySQL contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compileflow-workbench-mysql-8.4.7
          path: |
            compileflow-deploy/compileflow-deploy-mysql/target/surefire-reports/TEST-*MySqlDeployRepositoryContractTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*AsyncInvocationStoreContractTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*ExternalSchemaAdmissionTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*ProcessDraftServicePersistenceTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*ExecutionLogAggregationPersistenceTest.xml
          retention-days: 30

  runtime-compatibility:
    name: Server runtime compatibility (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: compileflow_smoke
          POSTGRES_USER: compileflow
          POSTGRES_PASSWORD: compileflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compileflow -d compileflow_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Package the executable JAR
        run: |
          ./mvnw package -pl compileflow-workbench-server -am -DskipTests \
            -B -V --no-transfer-progress

      - name: Smoke-test the executable JAR
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/compileflow_smoke
          SPRING_DATASOURCE_USERNAME: compileflow
          SPRING_DATASOURCE_PASSWORD: compileflow_test_password
        run: python3 scripts/smoke_test_workbench_server_executable_jar.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compileflow-workbench-server-jdk-${{ matrix.java }}-surefire
          path: compileflow-workbench-server/target/surefire-reports/
          retention-days: 7
