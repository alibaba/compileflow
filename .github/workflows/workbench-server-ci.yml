name: CompileFlow Workbench Server CI

on:
  workflow_call:
  push:
    branches: [ master ]
    paths:
      - 'compileflow-workbench-server/**'
      - 'compileflow-deploy/**'
      - 'compileflow-integration-tests/**'
      - 'compileflow-spring-boot-autoconfigure/**'
      - 'compileflow-api/**'
      - 'compileflow-core/**'
      - 'compileflow-tbbpm/**'
      - 'compileflow-bpmn/**'
      - 'docs/specs/openapi/**'
      - '.github/workflows/workbench-server-ci.yml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'checkstyle.xml'
      - 'checkstyle-javadoc.xml'
      - 'scripts/check_architecture_boundaries.py'
      - 'scripts/junit_evidence.py'
      - 'scripts/run_server_targeted_tests.sh'
      - 'scripts/tests/test_verify_workbench_postgres_evidence.py'
      - 'scripts/verify_workbench_postgres_evidence.py'
      - 'scripts/verify_spotbugs_reports.py'
      - 'scripts/smoke_test_workbench_server_executable_jar.py'
      - 'scripts/fixtures/executable-jar-flow.tbbpm.xml'
      - 'pom.xml'
  pull_request:
    branches: [ master ]
    paths:
      - 'compileflow-workbench-server/**'
      - 'compileflow-deploy/**'
      - 'compileflow-integration-tests/**'
      - 'compileflow-spring-boot-autoconfigure/**'
      - 'compileflow-api/**'
      - 'compileflow-core/**'
      - 'compileflow-tbbpm/**'
      - 'compileflow-bpmn/**'
      - 'docs/specs/openapi/**'
      - '.github/workflows/workbench-server-ci.yml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'checkstyle.xml'
      - 'checkstyle-javadoc.xml'
      - 'scripts/check_architecture_boundaries.py'
      - 'scripts/junit_evidence.py'
      - 'scripts/run_server_targeted_tests.sh'
      - 'scripts/tests/test_verify_workbench_postgres_evidence.py'
      - 'scripts/verify_workbench_postgres_evidence.py'
      - 'scripts/verify_spotbugs_reports.py'
      - 'scripts/smoke_test_workbench_server_executable_jar.py'
      - 'scripts/fixtures/executable-jar-flow.tbbpm.xml'
      - 'pom.xml'

permissions:
  contents: read

jobs:
  test:
    name: Server quality gates and unit tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: compileflow_test
          POSTGRES_USER: compileflow
          POSTGRES_PASSWORD: compileflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compileflow -d compileflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run architecture boundary checks
        run: python3 scripts/check_architecture_boundaries.py

      - name: Test PostgreSQL evidence verifier
        run: python3 -m unittest scripts.tests.test_verify_workbench_postgres_evidence

      - name: Build compileflow-workbench-server dependencies
        run: |
          ./mvnw install -pl compileflow-workbench-server -am -DskipTests \
            -B -V --no-transfer-progress

      - name: Run Spotless format check
        run: |
          ./mvnw -Pexamples,benchmarks spotless:check \
            -B -V --no-transfer-progress

      - name: Run compileflow-workbench-server checkstyle
        run: |
          ./mvnw checkstyle:check -pl compileflow-workbench-server -am \
            -B -V --no-transfer-progress

      - name: Run public API Javadoc style
        run: |
          ./mvnw checkstyle:check \
            -pl compileflow-api,compileflow-deploy/compileflow-deploy-api \
            -Dcheckstyle.config.location=checkstyle-javadoc.xml \
            -B -V --no-transfer-progress

      - name: Run compileflow-workbench-server SpotBugs
        run: |
          ./mvnw spotbugs:check -pl compileflow-workbench-server -am \
            -B -V --no-transfer-progress
          python3 scripts/verify_spotbugs_reports.py \
            compileflow-api \
            compileflow-core \
            compileflow-tbbpm \
            compileflow-bpmn \
            compileflow-deploy/compileflow-deploy-api \
            compileflow-deploy/compileflow-deploy-control-plane \
            compileflow-deploy/compileflow-deploy-runtime \
            compileflow-spring-boot-autoconfigure \
            compileflow-workbench-server

      - name: Generate public API Javadocs
        run: |
          ./mvnw javadoc:javadoc \
            -pl compileflow-api,compileflow-deploy/compileflow-deploy-api \
            -B -V --no-transfer-progress

      - name: Run deployment unit and H2 repository tests
        run: |
          ./mvnw test \
            -pl compileflow-deploy/compileflow-deploy-api,compileflow-deploy/compileflow-deploy-control-plane,compileflow-deploy/compileflow-deploy-runtime \
            -B -V --no-transfer-progress

      - name: Run targeted compileflow-workbench-server tests
        run: scripts/run_server_targeted_tests.sh

      - name: Smoke-test the executable JAR
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/compileflow_test
          SPRING_DATASOURCE_USERNAME: compileflow
          SPRING_DATASOURCE_PASSWORD: compileflow_test_password
        run: python3 scripts/smoke_test_workbench_server_executable_jar.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compileflow-workbench-server-surefire
          path: compileflow-workbench-server/target/surefire-reports/
          retention-days: 7

  postgres-contract:
    name: Workbench and Deploy PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '16.15'
            postgres_image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          - postgres: '17.11'
            postgres_image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          - postgres: '18.6'
            postgres_image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_DB: compileflow_test
          POSTGRES_USER: compileflow
          POSTGRES_PASSWORD: compileflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compileflow -d compileflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Validate Workbench, Deploy, and runtime-chain contracts
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/compileflow_test
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: compileflow
          SPRING_DATASOURCE_PASSWORD: compileflow_test_password
          SPRING_FLYWAY_LOCATIONS: classpath:db/compileflow-deploy/migration,classpath:db/compileflow-workbench-server/migration
          COMPILEFLOW_WORKBENCH_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/compileflow_test
          COMPILEFLOW_WORKBENCH_TEST_POSTGRES_USERNAME: compileflow
          COMPILEFLOW_WORKBENCH_TEST_POSTGRES_PASSWORD: compileflow_test_password
        run: |
          ./mvnw test \
            -pl compileflow-workbench-server,compileflow-integration-tests \
            -am \
            -Dtest=ProcessDraftServicePersistenceTest,ProcessOptimisticLockPersistenceTest,ExecutionLogAggregationPersistenceTest,AsyncInvocationRepositoryStateMachineTest,WorkbenchExternalSchemaAdmissionTest,PostgreSqlDeployRepositoryContractTest,DeploymentRuntimeChainIntegrationTest \
            -Dcompileflow.test.deploy.postgres.required=true \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -B -V --no-transfer-progress

      - name: Reject missing, failed, or skipped PostgreSQL evidence
        run: python3 scripts/verify_workbench_postgres_evidence.py .

      - name: Verify tested source identity
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Record PostgreSQL environment identity
        if: always()
        run: |
          mkdir -p compileflow-workbench-server/target/release-evidence
          {
            echo "commit=${GITHUB_SHA}"
            echo "declared_postgres=${{ matrix.postgres }}"
            echo "declared_image=${{ matrix.postgres_image }}"
            docker image inspect \
              --format='resolved_image={{index .RepoDigests 0}}' \
              '${{ matrix.postgres_image }}'
            java -version 2>&1
          } > compileflow-workbench-server/target/release-evidence/postgres-environment.txt

      - name: Upload PostgreSQL contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compileflow-workbench-postgres-${{ matrix.postgres }}
          path: |
            compileflow-deploy/compileflow-deploy-control-plane/target/surefire-reports/TEST-*PostgreSqlDeployRepositoryContractTest.xml
            compileflow-integration-tests/target/surefire-reports/TEST-*DeploymentRuntimeChainIntegrationTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*PersistenceTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*RepositoryStateMachineTest.xml
            compileflow-workbench-server/target/surefire-reports/TEST-*ExternalSchemaAdmissionTest.xml
            compileflow-workbench-server/target/release-evidence/postgres-environment.txt
          retention-days: 30

  runtime-compatibility:
    name: Server runtime compatibility (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: compileflow_smoke
          POSTGRES_USER: compileflow
          POSTGRES_PASSWORD: compileflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compileflow -d compileflow_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Package the executable JAR
        run: |
          ./mvnw package -pl compileflow-workbench-server -am -DskipTests \
            -B -V --no-transfer-progress

      - name: Smoke-test the executable JAR
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/compileflow_smoke
          SPRING_DATASOURCE_USERNAME: compileflow
          SPRING_DATASOURCE_PASSWORD: compileflow_test_password
        run: python3 scripts/smoke_test_workbench_server_executable_jar.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compileflow-workbench-server-jdk-${{ matrix.java }}-surefire
          path: compileflow-workbench-server/target/surefire-reports/
          retention-days: 7
