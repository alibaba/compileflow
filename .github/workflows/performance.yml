name: Performance Benchmarks

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: compileflow_benchmark
          POSTGRES_USER: compileflow_benchmark
          POSTGRES_PASSWORD: benchmark-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compileflow_benchmark -d compileflow_benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run JMH benchmarks
        run: |
          ./mvnw verify -Pbenchmarks -pl compileflow-benchmarks -am -q
          java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar \
            -rf json \
            -rff compileflow-benchmarks/target/jmh-steady-state.json \
            -wi 3 -i 3 -f 3 \
            'BaselineJavaBenchmark|CompileFlowExecuteBenchmark|BpmnExecuteBenchmark'
          java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar \
            -rf json \
            -rff compileflow-benchmarks/target/jmh-first-execution.json \
            CompileFlowFirstExecutionBenchmark
          java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar \
            -rf json \
            -rff compileflow-benchmarks/target/jmh-process-call.json \
            -t 1 -wi 2 -i 3 -w 1s -r 2s -f 1 \
            -p callDepth=0,1,4 \
            ProcessCallExecuteBenchmark
          for scenario in SEQUENCE_64 LOOP_64 PARALLEL_8 INCLUSIVE_8; do
            java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar \
              -rf json \
              -rff "compileflow-benchmarks/target/jmh-durable-machine-${scenario}.json" \
              -t 1 -wi 3 -i 3 -w 1s -r 2s -f 3 \
              -p "scenario=${scenario}" \
              DurableMachineAdvanceBenchmark
          done
          for threads in 1 4 16 32 64; do
            java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar \
              -rf json \
              -rff "compileflow-benchmarks/target/jmh-contention-${threads}-threads.json" \
              -t "$threads" -wi 2 -i 3 -w 1s -r 2s -f 1 \
              'CompileFlowConcurrentExecuteBenchmark|CompileFlowAliasExecuteBenchmark'
          done
          export COMPILEFLOW_DURABLE_BENCHMARK_JDBC_URL=jdbc:postgresql://127.0.0.1:5432/compileflow_benchmark
          export COMPILEFLOW_DURABLE_BENCHMARK_USERNAME=compileflow_benchmark
          export COMPILEFLOW_DURABLE_BENCHMARK_PASSWORD=benchmark-only-password
          export COMPILEFLOW_DURABLE_BENCHMARK_ALLOW_CLEAN=true
          java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar \
            -rf json \
            -rff compileflow-benchmarks/target/jmh-durable-postgres.json \
            -t 1 -wi 2 -i 3 -w 1s -r 2s -f 1 \
            -p snapshotBytes=16384 \
            DurablePostgresBoundaryBenchmark
          for snapshot_bytes in 16384 65536 262144 1048576; do
            java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar \
              -rf json \
              -rff "compileflow-benchmarks/target/jmh-durable-payload-${snapshot_bytes}.json" \
              -t 1 -wi 2 -i 3 -w 1s -r 2s -f 1 \
              -p "snapshotBytes=${snapshot_bytes}" \
              'DurablePostgresBoundaryBenchmark.startRun|DurablePostgresBoundaryBenchmark.commitWaitBoundary|DurablePostgresBoundaryBenchmark.commitTimerBoundary|DurablePostgresBoundaryBenchmark.commitEffectBoundary'
          done
          for threads in 1 4 16 32; do
            java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar \
              -rf json \
              -rff "compileflow-benchmarks/target/jmh-durable-contention-${threads}-threads.json" \
              -t "$threads" -wi 2 -i 3 -w 1s -r 2s -f 1 \
              -p snapshotBytes=16384 \
              'DurablePostgresBoundaryBenchmark.startRun|DurablePostgresBoundaryBenchmark.claimRun|DurablePostgresBoundaryBenchmark.claimEffectReconcile'
          done

      - name: Validate JMH results
        run: |
          python3 scripts/verify_jmh_results.py \
            compileflow-benchmarks/target/jmh-steady-state.json \
            --expected-forks 3 \
            --expected-iterations 3 \
            --expected-benchmark com.alibaba.compileflow.benchmarks.BaselineJavaBenchmark.baselineAddTwo \
            --expected-benchmark com.alibaba.compileflow.benchmarks.CompileFlowExecuteBenchmark.execute \
            --expected-benchmark com.alibaba.compileflow.benchmarks.BpmnExecuteBenchmark.execute
          python3 scripts/verify_jmh_results.py \
            compileflow-benchmarks/target/jmh-first-execution.json \
            --expected-forks 10 \
            --expected-iterations 1 \
            --expected-benchmark com.alibaba.compileflow.benchmarks.CompileFlowFirstExecutionBenchmark.firstExecution
          python3 scripts/verify_jmh_results.py \
            compileflow-benchmarks/target/jmh-process-call.json \
            --expected-forks 1 \
            --expected-iterations 3 \
            --expected-threads 1 \
            --expected-benchmark com.alibaba.compileflow.benchmarks.ProcessCallExecuteBenchmark.execute
          for scenario in SEQUENCE_64 LOOP_64 PARALLEL_8 INCLUSIVE_8; do
            python3 scripts/verify_jmh_results.py \
              "compileflow-benchmarks/target/jmh-durable-machine-${scenario}.json" \
              --expected-forks 3 \
              --expected-iterations 3 \
              --expected-threads 1 \
              --expected-param "scenario=${scenario}" \
              --expected-benchmark com.alibaba.compileflow.benchmarks.DurableMachineAdvanceBenchmark.advanceToCompletion
          done
          for threads in 1 4 16 32 64; do
            python3 scripts/verify_jmh_results.py \
              "compileflow-benchmarks/target/jmh-contention-${threads}-threads.json" \
              --expected-forks 1 \
              --expected-iterations 3 \
              --expected-threads "$threads" \
              --expected-benchmark com.alibaba.compileflow.benchmarks.CompileFlowConcurrentExecuteBenchmark.concurrentExecute \
              --expected-benchmark com.alibaba.compileflow.benchmarks.CompileFlowAliasExecuteBenchmark.canaryAliasExecute \
              --expected-benchmark com.alibaba.compileflow.benchmarks.CompileFlowAliasExecuteBenchmark.stableAliasExecute
          done
          python3 scripts/verify_jmh_results.py \
            compileflow-benchmarks/target/jmh-durable-postgres.json \
            --expected-forks 1 \
            --expected-iterations 3 \
            --expected-threads 1 \
            --expected-param snapshotBytes=16384 \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.startRun \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.commitWaitBoundary \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.commitTimerBoundary \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.completeWait \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.commitEffectBoundary \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.claimRun \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.completeRun \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.completeEffect \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.markEffectUnknown \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.claimEffectReconcile \
            --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.claimOutbox
          for snapshot_bytes in 16384 65536 262144 1048576; do
            python3 scripts/verify_jmh_results.py \
              "compileflow-benchmarks/target/jmh-durable-payload-${snapshot_bytes}.json" \
              --expected-forks 1 \
              --expected-iterations 3 \
              --expected-threads 1 \
              --expected-param "snapshotBytes=${snapshot_bytes}" \
              --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.startRun \
              --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.commitWaitBoundary \
              --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.commitTimerBoundary \
              --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.commitEffectBoundary
          done
          for threads in 1 4 16 32; do
            python3 scripts/verify_jmh_results.py \
              "compileflow-benchmarks/target/jmh-durable-contention-${threads}-threads.json" \
              --expected-forks 1 \
              --expected-iterations 3 \
              --expected-threads "$threads" \
              --expected-param snapshotBytes=16384 \
              --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.startRun \
              --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.claimRun \
              --expected-benchmark com.alibaba.compileflow.benchmarks.DurablePostgresBoundaryBenchmark.claimEffectReconcile
          done

      - name: Record benchmark environment
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "steady_state_command=java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar -rf json -rff compileflow-benchmarks/target/jmh-steady-state.json -wi 3 -i 3 -f 3 'BaselineJavaBenchmark|CompileFlowExecuteBenchmark|BpmnExecuteBenchmark'"
            echo "first_execution_command=java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar -rf json -rff compileflow-benchmarks/target/jmh-first-execution.json CompileFlowFirstExecutionBenchmark"
            echo "process_call_command=java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar -rf json -rff compileflow-benchmarks/target/jmh-process-call.json -t 1 -wi 2 -i 3 -w 1s -r 2s -f 1 -p callDepth=0,1,4 ProcessCallExecuteBenchmark"
            echo "durable_machine_scenarios=SEQUENCE_64,LOOP_64,PARALLEL_8,INCLUSIVE_8"
            echo "durable_machine_command_template=java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar -rf json -rff compileflow-benchmarks/target/jmh-durable-machine-SCENARIO.json -t 1 -wi 3 -i 3 -w 1s -r 2s -f 3 -p scenario=SCENARIO DurableMachineAdvanceBenchmark"
            echo "contention_threads=1,4,16,32,64"
            echo "contention_command_template=java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar -rf json -rff compileflow-benchmarks/target/jmh-contention-THREADS-threads.json -t THREADS -wi 2 -i 3 -w 1s -r 2s -f 1 'CompileFlowConcurrentExecuteBenchmark|CompileFlowAliasExecuteBenchmark'"
            echo "durable_postgres_image=postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2"
            echo "durable_snapshot_bytes=16384,65536,262144,1048576"
            echo "durable_contention_threads=1,4,16,32"
            echo "durable_postgres_command=java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar -rf json -rff compileflow-benchmarks/target/jmh-durable-postgres.json -t 1 -wi 2 -i 3 -w 1s -r 2s -f 1 -p snapshotBytes=16384 DurablePostgresBoundaryBenchmark"
            echo "durable_payload_command_template=java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar -rf json -rff compileflow-benchmarks/target/jmh-durable-payload-SNAPSHOT_BYTES.json -t 1 -wi 2 -i 3 -w 1s -r 2s -f 1 -p snapshotBytes=SNAPSHOT_BYTES 'DurablePostgresBoundaryBenchmark.startRun|DurablePostgresBoundaryBenchmark.commitWaitBoundary|DurablePostgresBoundaryBenchmark.commitTimerBoundary|DurablePostgresBoundaryBenchmark.commitEffectBoundary'"
            echo "durable_contention_command_template=java -jar compileflow-benchmarks/target/compileflow-benchmarks.jar -rf json -rff compileflow-benchmarks/target/jmh-durable-contention-THREADS-threads.json -t THREADS -wi 2 -i 3 -w 1s -r 2s -f 1 -p snapshotBytes=16384 'DurablePostgresBoundaryBenchmark.startRun|DurablePostgresBoundaryBenchmark.claimRun|DurablePostgresBoundaryBenchmark.claimEffectReconcile'"
            echo
            java -version 2>&1
            echo
            uname -a
            echo
            lscpu
            echo
            free -h
          } > compileflow-benchmarks/target/environment.txt

      - name: Archive JMH results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jmh-results-${{ github.sha }}
          path: |
            compileflow-benchmarks/target/jmh-steady-state.json
            compileflow-benchmarks/target/jmh-first-execution.json
            compileflow-benchmarks/target/jmh-process-call.json
            compileflow-benchmarks/target/jmh-durable-machine-*.json
            compileflow-benchmarks/target/jmh-contention-*-threads.json
            compileflow-benchmarks/target/jmh-durable-postgres.json
            compileflow-benchmarks/target/jmh-durable-payload-*.json
            compileflow-benchmarks/target/jmh-durable-contention-*-threads.json
            compileflow-benchmarks/target/environment.txt
          retention-days: 90
