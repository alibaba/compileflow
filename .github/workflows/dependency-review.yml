name: Dependency Review

on:
  pull_request:
    branches: [ master ]
    paths:
      - '**/pom.xml'
      - 'compileflow-workbench/package.json'
      - 'compileflow-workbench/pnpm-lock.yaml'
      - 'compileflow-workbench/pnpm-workspace.yaml'
      - 'compileflow-workbench/**/package.json'
      - 'compileflow-workbench/docker/**'
      - 'compileflow-workbench/docker-compose.yml'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Reject newly introduced vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
