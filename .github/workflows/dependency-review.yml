name: Dependency Review

on:
  pull_request:
    branches: [ master ]
    paths:
      - '**/pom.xml'
      - 'compileflow-workbench/package.json'
      - 'compileflow-workbench/pnpm-lock.yaml'
      - 'compileflow-workbench/pnpm-workspace.yaml'
      - 'compileflow-workbench/**/package.json'
      - 'compileflow-workbench/docker/**'
      - 'compileflow-workbench/docker-compose.yml'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Reject newly introduced vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
